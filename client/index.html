<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GFM Designer</title>
    <script>
        // Bootstrap colour mode following the system preference
        try {
            const dark = window.matchMedia('(prefers-color-scheme: dark)');
            const apply = () => document.documentElement.setAttribute('data-bs-theme', dark.matches ? 'dark' : 'light');
            apply();
            dark.addEventListener('change', apply);
        } catch { /* light mode */ }
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <nav class="navbar navbar-expand bg-body border-bottom app-navbar">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center gap-2" href="./" data-nav="list">
                <span class="brand-mark"><i class="bi bi-ui-checks-grid"></i></span>
                <span>GFM Designer</span>
            </a>
            <div class="d-flex align-items-center gap-3 ms-auto">
                <span id="user" class="text-body-secondary small d-none d-sm-inline"></span>
                <button id="logout" class="btn btn-sm btn-outline-secondary d-none" type="button">
                    <i class="bi bi-box-arrow-right"></i><span class="d-none d-md-inline ms-1">Déconnexion</span>
                </button>
            </div>
        </div>
    </nav>

    <main id="app" class="app-main"></main>

    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toasts"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
